name: Fetch Cactus Bundle

"on":
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone engine repo
        run: |
          git clone --depth 1 https://github.com/cactus-compute/engine
          echo "--- 根目录 ---"
          ls engine
          echo "--- python 目录 ---"
          ls engine/python
          echo "--- python 里有没有 setup/pyproject ---"
          ls engine/python | grep -iE "setup|pyproject|requirements" || echo "无"

      - name: Install python package
        run: |
          set -x
          if [ -f engine/python/pyproject.toml ] || [ -f engine/python/setup.py ]; then
            pip install -e ./engine/python 2>&1 | tail -15
          fi
          pip install huggingface_hub requests 2>&1 | tail -5
          python -c "import sys; sys.path.insert(0,'engine/python'); import cactus; print('cactus ok', cactus.__file__)" 2>&1 | tail -5

      - name: Download bundle
        working-directory: engine
        run: |
          set +e
          python -c "
import sys
sys.argv = ['cactus', 'download', 'Cactus-Compute/Qwen3.5-2B', '--bits', '4']
from cactus.cli import main
main()
" 2>&1 | tail -40
          echo "exit=$?"
          echo "=== 找权重 ==="
          ls -la weights/ 2>/dev/null || ls -la ~/.cache/cactus/weights/ 2>/dev/null || echo "都没找到"

      - name: Inspect bundle
        run: |
          echo "=== 候选目录 ==="
          for d in engine/weights ~/.cache/cactus/weights; do
            if [ -d "$d" ]; then echo "--- $d ---"; du -sh "$d"/*; fi
          done
          echo "=== manifest 位置 ==="
          find engine ~/.cache -name "manifest.json" 2>/dev/null | head
          echo "=== bundle 内部 ==="
          find engine ~/.cache -name "manifest.json" 2>/dev/null | head -1 | while read m; do
            echo "manifest: $m"
            d=$(dirname $(dirname "$m"))
            echo "bundle dir: $d"
            ls -la "$d"
            echo "--- components ---"
            ls -la "$d/components" | head -20
          done

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-bundle
          path: |
            engine/weights/
            /home/runner/.cache/cactus/weights/
          if-no-files-found: warn
          retention-days: 3
