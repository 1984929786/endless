name: Fetch Cactus Bundle

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Clone cactus
        run: |
          git clone --depth 1 https://github.com/cactus-compute/cactus
          ls cactus

      - name: Setup cactus
        working-directory: cactus
        run: |
          cat setup | head -40
          source ./setup
          which cactus || true
          cactus --help 2>&1 | head -30

      - name: Download bundle
        working-directory: cactus
        run: |
          source ./setup
          set +e
          cactus download Cactus-Compute/Qwen3.5-2B --bits 4 2>&1 | tail -40
          echo "exit=$?"

      - name: Inspect result
        run: |
          echo "=== 找 bundle 目录 ==="
          find / -name "manifest.json" -path "*components*" 2>/dev/null | head -10
          echo "=== cactus 目录树 ==="
          find ~ -maxdepth 4 -type d 2>/dev/null | grep -iE "weights|cactus" | head -30
          echo "=== 磁盘 ==="
          df -h /

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-bundle
          path: |
            ~/.cactus/**
            weights/**
          if-no-files-found: warn
          retention-days: 3
