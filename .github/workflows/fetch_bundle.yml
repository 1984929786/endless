name: Fetch Cactus Bundle

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone engine repo
        run: |
          git clone --depth 1 https://github.com/cactus-compute/engine
          ls engine
          echo "--- python 目录 ---"
          ls engine/python

      - name: Install python package
        run: |
          cd engine
          pip install -e . 2>&1 | tail -20 || pip install -r requirements.txt 2>&1 | tail -20 || true
          pip list | grep -i cactus || true

      - name: Show CLI help
        run: |
          cd engine
          python -m cactus.cli --help 2>&1 | head -40 || \
          python python/cactus/__main__.py --help 2>&1 | head -40 || \
          python -m cactus --help 2>&1 | head -40

      - name: Download bundle
        run: |
          cd engine
          set +e
          python -m cactus.cli download Cactus-Compute/Qwen3.5-2B --bits 4 2>&1 | tail -50
          echo "exit=$?"
          echo "=== weights 目录 ==="
          ls -la weights/ 2>/dev/null || echo "没有 weights"

      - name: Inspect bundle
        run: |
          echo "=== bundle 结构 ==="
          find . -name "manifest.json" -path "*components*" 2>/dev/null | head
          find . -maxdepth 6 -type d -name "*qwen*" 2>/dev/null | head
          if [ -d engine/weights ]; then
            du -sh engine/weights/* 2>/dev/null
            echo "--- 一层内容 ---"
            ls -la engine/weights/*/ 2>/dev/null | head -30
          fi

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-bundle
          path: engine/weights/
          if-no-files-found: warn
          retention-days: 3
