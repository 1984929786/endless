name: Fetch Cactus Bundle

on:
  push:
    paths:
      - trigger-fetch/**
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone engine repo
        run: git clone --depth 1 https://github.com/cactus-compute/engine

      - name: Install python package
        run: |
          pip install -e ./engine/python 2>&1 | tail -8
          pip install huggingface_hub requests 2>&1 | tail -3

      - name: Write download script
        run: |
          cat > /tmp/dl.py <<'PYEOF'
          import sys
          sys.argv = ['cactus', 'download', 'Cactus-Compute/Qwen3.5-2B', '--bits', '4']
          from cactus.cli import main
          main()
          PYEOF
          echo written

      - name: Download bundle
        working-directory: engine
        run: |
          python /tmp/dl.py 2>&1 | tail -40 || true
          echo "=== weights ==="
          ls -la weights/ 2>/dev/null || echo "no weights"

      - name: Inspect bundle
        run: |
          for d in engine/weights /home/runner/.cache/cactus/weights; do
            if [ -d "$d" ]; then echo "--- $d ---"; du -sh "$d"/* ; fi
          done
          find engine /home/runner/.cache -name manifest.json 2>/dev/null | head -3

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-bundle
          path: |
            engine/weights/
            /home/runner/.cache/cactus/weights/
          if-no-files-found: warn
          retention-days: 3
