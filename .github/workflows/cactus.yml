name: Build Cactus Engine

on:
  workflow_dispatch:
  push:
    paths:
      - trigger-cactus/**

jobs:
  build-cactus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          set -e
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK 安装完成"
          ls "$ANDROID_HOME/ndk"

      - name: Clone Cactus engine
        run: |
          git clone --depth 1 --branch v1.14 https://github.com/cactus-compute/engine.git cactus-src
          cd cactus-src
          echo "--- 版本:"; git log -1 --oneline
          echo "--- 大小:"; du -sh .
          echo "--- android 目录:"; ls android

      - name: Inspect engine deps
        run: |
          cd cactus-src
          echo "=== cactus-engine 目录:"
          ls cactus-engine
          echo "=== libs:"
          ls cactus-engine/libs 2>/dev/null || echo "无 libs 目录"
          echo "=== 找 curl:"
          find . -maxdepth 4 -name "*curl*" -type d 2>/dev/null | head

      - name: Build Cactus for Android
        run: |
          set -e
          cd cactus-src
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME/ndk/"* | head -1)
          echo "NDK: $ANDROID_NDK_HOME"
          export ANDROID_PLATFORM=android-26
          export CMAKE_BUILD_TYPE=Release
          bash android/build.sh 2>&1 | tail -80

      - name: Check output
        run: |
          echo "=== 产物:"
          find cactus-src -name "*.so" -o -name "*.a" | head -20
          find cactus-src -name "libcactus_engine.so" -exec ls -lh {} \;

      - name: Upload .so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-engine-so
          path: |
            cactus-src/android/build/**/*.so
            cactus-src/**/*.so
          if-no-files-found: warn
