name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual)
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          echo "使用镜像预装的 SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

          # 优先用 runner 预装的 SDK；没有就自己下
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
            echo "SDK_DIR=$ANDROID_HOME" >> $GITHUB_ENV
          else
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
            echo "SDK_DIR=$SDK" >> $GITHUB_ENV
          fi

      - name: Install SDK packages
        run: |
          set -e
          SDKMGR=$(find "$SDK_DIR" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "安装完成"
          ls "$SDK_DIR/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List outputs
        run: find app -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: endless-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
