name: Build Endless APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125" > /dev/null
          echo "SDK 就绪"
          echo "NDK: $ANDROID_HOME/ndk/26.1.10909125"

      # llama.cpp 的 Android lib 模块要 add_subdirectory 整个源码树，
      # 所以必须在这里 clone 一份（约 200MB，比 Cactus 预编译 .so 麻烦，但格式公开、可控）
      - name: Clone llama.cpp source
        run: |
          set -e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          echo "commit: $(git rev-parse --short HEAD)"
          ls include/llama.h ggml/include/ggml.h common/common.h

      # lib 模块的 CMakeLists 里 LLAMA_SRC 是相对路径 `../../../../../../`，
      # 从 app/llama/src/main/cpp 往上 6 层正好是仓库根 endless/app/。
      # 所以把 llama.cpp 放到 endless/app/llama.cpp，并在 launcher 里指过去。
      - name: Place llama.cpp for CMake
        run: |
          set -e
          # app/llama/src/main/cpp → 上6层 = app/  （即 endless/app）
          # 验证这个推断
          cd app/llama/src/main/cpp
          UP6=$(realpath ../../../../../..)
          echo "上6层 = $UP6"
          if [ "$UP6" != "$(realpath ../../../..)" ]; then echo "警告: 层级推断可能不符"; fi
          echo "把 llama.cpp 放到 $UP6/llama.cpp"
          cp -r /tmp/llama.cpp "$UP6/llama.cpp"
          ls "$UP6/llama.cpp/include/llama.h"

      - name: Download GGUF model
        run: |
          set -e
          mkdir -p /tmp/mdl
          URL="https://hf-mirror.com/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"
          echo "下载: $URL"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/mdl/model.gguf "$URL"
          SZ=$(stat -c%s /tmp/mdl/model.gguf)
          echo "大小: $SZ 字节 ($((SZ/1048576))MB)"
          test "$SZ" -gt 300000000 || { echo "模型文件太小，下载失败"; exit 1; }
          # GGUF magic 校验：前 4 字节必须是 "GGUF"
          MAGIC=$(head -c 4 /tmp/mdl/model.gguf)
          echo "magic: $MAGIC"
          test "$MAGIC" = "GGUF" || { echo "不是合法的 GGUF 文件"; exit 1; }

      - name: Put model into assets
        run: |
          set -e
          DEST=app/app/src/main/assets/models
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp /tmp/mdl/model.gguf "$DEST/Qwen3-0.6B-Q4_K_M.gguf"
          ls -lh "$DEST"

      - name: Build debug APK
        working-directory: app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log | grep -E "^e: |^w: .*error|BUILD |FAILURE|> Task .*FAILED" || true
          echo "=== 完整日志已存 /tmp/build.log ==="
          grep -E "^e: " /tmp/build.log | head -40 || echo "无 e: 开头的编译错误"
          if ! grep -q "BUILD SUCCESSFUL" /tmp/build.log; then
            echo "=== 构建失败，最后 80 行 ==="
            tail -80 /tmp/build.log
            exit 1
          fi

      - name: Verify APK contents
        working-directory: app
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          echo "=== gguf ==="
          unzip -l "$APK" | grep -i "gguf" || echo "(无 gguf)"
          echo "=== so ==="
          unzip -l "$APK" | grep "\.so" | head -20 || echo "(无 so)"
          echo "=== 检查关键产物 ==="
          if unzip -l "$APK" | grep -qi "gguf"; then echo "✓ 模型已打包"; else echo "✗ 缺模型"; exit 1; fi
          if unzip -l "$APK" | grep -q "libllama"; then echo "✓ llama native 库已打包"; else echo "✗ 缺 llama .so"; exit 1; fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endless-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
