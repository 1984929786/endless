name: Build Endless APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'memory/**'
      - 'trigger-build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: openclaw-runtime/package-lock.json

      - name: Set up Android SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK 就绪"

      # ===== 内嵌 OpenClaw 网关运行时 =====
      - name: Install embedded OpenClaw runtime
        working-directory: openclaw-runtime
        run: |
          set -e
          npm install --no-audit --no-fund --os=linux --cpu=arm64
          test -f node_modules/openclaw/openclaw.mjs
          test -d node_modules/openclaw/dist
          echo "✓ openclaw.mjs + dist 就绪"
          du -sh node_modules

      - name: Install bundled plugin runtime deps
        run: |
          set -e
          # openclaw 2026.11+ 扩展已无 package.json，依赖由主 npm install 自动拉取
          # 这里只做存在性断言，不再二次安装
          echo "✓ 扩展依赖由主 npm install 处理"
          du -sh openclaw-runtime/node_modules

      - name: Repack runtime into App assets
        run: |
          set -e
          SRC=openclaw-runtime/node_modules
          DEST=app/app/src/main/assets/openclaw/runtime
          rm -rf "$DEST"
          mkdir -p "$DEST"

          cp -r "$SRC"/openclaw/* "$DEST"/
          test -f "$DEST/openclaw.mjs" || { echo "✗ 缺 openclaw.mjs"; exit 1; }

          mkdir -p "$DEST/node_modules"
          for d in "$SRC"/*; do
            b=$(basename "$d")
            [ "$b" = "openclaw" ] && continue
            cp -r "$d" "$DEST/node_modules/"
          done

          # 剔除非运行时产物
          node tools/strip_nonruntime.js "$DEST" --apply
          RUNTIME_FILES=$(find "$DEST" -type f | wc -l)
          echo "runtime 文件数：$RUNTIME_FILES"
          test "$RUNTIME_FILES" -lt 60000 || { echo "✗ 文件数 $RUNTIME_FILES 太接近 zip 上限"; exit 1; }

          # workspace 模板断言
          TPL="$DEST/docs/reference/templates"
          test -d "$TPL" || { echo "✗ 缺 docs/reference/templates"; exit 1; }
          for f in AGENTS.md SOUL.md TOOLS.md IDENTITY.md USER.md HEARTBEAT.md; do
            test -f "$TPL/$f" || { echo "✗ 缺 workspace 模板 $f"; exit 1; }
          done
          echo "✓ workspace 模板齐全"

          # 清理点开头文件
          find "$DEST/node_modules" -type f -name '.*' -delete
          find "$DEST/node_modules" -type d -name '.bin' -exec rm -rf {} + 2>/dev/null || true

          # 下划线路径改名
          node tools/ununderscore.js "$DEST"
          node tools/selfcheck.js generate
          node tools/selfcheck.js verify
          node tools/check_aaa_clean.js "$DEST"

          # 生成释放清单
          node tools/make_manifest.js "$DEST" app/app/src/main/openclaw/manifest.txt app/app/build.gradle
          MANI=$(wc -l < app/app/src/main/openclaw/manifest.txt)
          echo "清单条数：$MANI"
          test "$MANI" -gt 30000 || { echo "✗ 清单条数异常：$MANI"; exit 1; }

      # ===== 构建 =====
      - name: Build debug APK
        working-directory: app
        run: |
          set -o pipefail
          KS=ywzj-debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" -storetype JKS \
              -alias ywzj -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass yongwuzhijing -keypass yongwuzhijing \
              -dname "CN=YongWuZhiJing, OU=Dev, O=XunDao, L=CN, ST=CN, C=CN"
          fi
          export VERSION_CODE=${{ github.run_number }}
          export VERSION_NAME=3.9.${{ github.run_number }}
          echo "构建版本: $VERSION_NAME (code $VERSION_CODE)"
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log > /dev/null || true
          if grep -q "BUILD SUCCESSFUL" /tmp/build.log; then
            echo "✓ 构建成功"
            APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
            if [ -z "$APK" ]; then
              echo "✗ 构建成功但找不到 APK"
              find . -name "*.apk" -not -path "*/.gradle/*" | head -5
              exit 1
            fi
            BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
            GOT=$("${BT}aapt" dump badging "$APK" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            echo "产物 versionCode=$GOT 期望=$VERSION_CODE"
            [ -n "$GOT" ] || { echo "✗ 读不到 versionCode"; exit 1; }
            [ "$GOT" = "$VERSION_CODE" ] || { echo "✗ versionCode 不符"; exit 1; }
          else
            echo "=== 构建失败 ==="
            grep -E "^e: " /tmp/build.log | head -40 || echo "（无编译错误）"
            grep -E "^> Task .*FAILED|^FAILURE:" /tmp/build.log || echo "（无失败任务）"
            tail -40 /tmp/build.log
            exit 1
          fi

      - name: Check release rules
        run: |
          node tools/check_release_rules.js app/app/src/main/java/com/xundao/yongwuzhijing/GatewayLauncher.kt

      - name: Sync manifest with real APK contents
        run: |
          set -e
          APK=$(find app -name "*.apk" | head -1)
          test -n "$APK" || { echo "✗ 未找到 APK"; exit 1; }
          node tools/sync_manifest_into_apk.js "$APK" "$APK.out.apk"
          mv "$APK.out.apk" "$APK"
          echo "✓ 清单已同步"

      - name: Sign APK
        run: |
          set -e
          APK=$(find app -name "*.apk" | head -1)
          KS=app/ywzj-debug.keystore
          test -f "$KS" || KS=app/app/ywzj-debug.keystore
          test -f "$KS" || { echo "✗ 缺 keystore"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" sign \
            --ks "$KS" --ks-key-alias ywzj \
            --ks-pass pass:yongwuzhijing --key-pass pass:yongwuzhijing \
            --v1-signing-enabled true --v2-signing-enabled true \
            "$APK"
          echo "✓ 已签名"

      - name: Verify APK
        working-directory: app
        run: |
          set -e
          APK=$(find . -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "✗ 未找到 APK"; exit 1; }
          ls -lh "$APK"
          N=$(unzip -l "$APK" | tail -1 | awk '{print $2}')
          echo "zip 条目数: $N"
          test "$N" -gt 30000 || { echo "✗ 条目数 $N 太少"; exit 1; }
          unzip -l "$APK" | grep -q "assets/openclaw/runtime/openclaw.mjs" || { echo "✗ 缺 openclaw.mjs"; exit 1; }
          unzip -l "$APK" | grep -q "assets/openclaw/runtime/dist/index.js" || { echo "✗ 缺 dist/index.js"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libnode.so" || { echo "✗ 缺 libnode.so"; exit 1; }
          echo "✓ 结构正确"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: endless-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
