name: Build Endless APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK 就绪"

      - name: Restore native lib
        working-directory: app
        run: |
          set -e
          GZ=app/src/main/jniLibs/arm64-v8a/libcactus.so.gz
          if [ -f "$GZ" ]; then
            gunzip -c "$GZ" > app/src/main/jniLibs/arm64-v8a/libcactus.so
            rm -f "$GZ"
            chmod 644 app/src/main/jniLibs/arm64-v8a/libcactus.so
            ls -lh app/src/main/jniLibs/arm64-v8a/
          else
            echo "警告：未找到 libcactus.so.gz"
          fi

      - name: Build debug APK
        working-directory: app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List outputs
        working-directory: app
        run: |
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endless-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
