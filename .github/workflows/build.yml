name: Build Endless APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'memory/**'
      - 'trigger-build/**'
  workflow_dispatch:

# 注意（2026-11-21 教训）：
# 推送工具 gh_push2.js 是「一个文件一次 commit」，每个 commit 都会触发一次构建。
# 51 个文件 = 51 个 queued run，队列被自己的提交堵死，真正要的那个排在最后。
# 所以：用 gh_push_bulk.js 一次性提交，或者推完手动 dispatch 指定 commit。
# 这里保留 push 触发是给正常 git push 用的（单次 commit）。

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125" > /dev/null
          echo "SDK 就绪"
          echo "NDK: $ANDROID_HOME/ndk/26.1.10909125"

      # llama.cpp 的 Android lib 模块要 add_subdirectory 整个源码树，
      # 所以必须在这里 clone 一份（约 200MB，比 Cactus 预编译 .so 麻烦，但格式公开、可控）
      - name: Clone llama.cpp source
        run: |
          set -e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          echo "commit: $(git rev-parse --short HEAD)"
          ls include/llama.h ggml/include/ggml.h common/common.h

      # CMakeLists.txt 里 LLAMA_SRC = ${CMAKE_CURRENT_LIST_DIR}/../../../../llama.cpp
      # 从 app/llama/src/main/cpp 上溯 4 层 = app/，所以源码必须放在 app/llama.cpp
      - name: Place llama.cpp for CMake
        run: |
          set -e
          DEST=$(realpath app/llama/src/main/cpp/../../../..)/llama.cpp
          echo "目标路径: $DEST"
          rm -rf "$DEST"
          cp -r /tmp/llama.cpp "$DEST"
          ls "$DEST/CMakeLists.txt" "$DEST/include/llama.h"
          echo "✓ llama.cpp 就位"

      - name: Download GGUF model
        run: |
          set -e
          mkdir -p /tmp/mdl
          URL="https://hf-mirror.com/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf"
          echo "下载: $URL"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/mdl/model.gguf "$URL"
          SZ=$(stat -c%s /tmp/mdl/model.gguf)
          echo "大小: $SZ 字节 ($((SZ/1048576))MB)"
          test "$SZ" -gt 900000000 || { echo "模型文件太小，下载失败"; exit 1; }
          # GGUF magic 校验：前 4 字节必须是 "GGUF"
          MAGIC=$(head -c 4 /tmp/mdl/model.gguf)
          echo "magic: $MAGIC"
          test "$MAGIC" = "GGUF" || { echo "不是合法的 GGUF 文件"; exit 1; }

      - name: Put model into assets
        run: |
          set -e
          # 注意：ModelBridge.findAssetGguf() 先找 assets/models/current/，再找顶层。
          # **必须放 current 子目录** —— 2026-11-21 现场：放顶层虽然进了 APK，
          # App 却报「找不到模型文件」，assets.list() 对顶层大文件不可靠。
          # current 子目录是 3.0.2 验证过的布局。
          DEST=app/app/src/main/assets/models/current
          rm -rf app/app/src/main/assets/models
          mkdir -p "$DEST"
          cp /tmp/mdl/model.gguf "$DEST/Qwen3-1.7B-Q4_K_M.gguf"
          ls -lh "$DEST"

      # ===== 内嵌 OpenClaw 网关（B 方案，2026-11-21） =====
      # 为什么在 CI 里 npm install，而不是把 node_modules 放进仓库：
      #   本地那份 node_modules 是 Windows 机同步过来的，1011MB 里 240MB 是
      #   win32 二进制、136MB 是 lancedb-win32，在 Android arm64 上一个都用不了。
      #   而且单文件超 GitHub 100MB 上限，物理上推不上去。
      #   所以只放 package.json 清单，让 npm 自己拉正确平台。
      - name: Install embedded OpenClaw runtime
        working-directory: openclaw-runtime
        run: |
          set -e
          echo "=== 安装 openclaw 运行时（cd 目标 linux-arm64）==="
          npm install --no-audit --no-fund --os=linux --cpu=arm64
          echo "=== 安装结果 ==="
          du -sh node_modules
          echo "=== 确认关键文件 ==="
          test -f node_modules/openclaw/openclaw.mjs
          test -d node_modules/openclaw/dist
          echo "✓ openclaw.mjs + dist 就位"
          echo "=== 平台包分布（供确认）==="
          find node_modules -maxdepth 4 -type d -name '*win32*' | head -20
          echo "--- darwin ---"
          find node_modules -maxdepth 4 -type d -name '*darwin*' | head -20
          echo "--- linux-x64 ---"
          find node_modules -maxdepth 4 -type d -name '*linux-x64*' | head -20

      - name: Repack runtime into App assets
        run: |
          set -e
          SRC=openclaw-runtime/node_modules
          DEST=app/app/src/main/assets/openclaw/runtime
          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo "=== 拷贝 openclaw 包本体 ==="
          cp -r "$SRC"/openclaw/* "$DEST"/
          test -f "$DEST/openclaw.mjs" || { echo "✗ 缺 openclaw.mjs"; exit 1; }

          echo "=== 拷贝依赖（白名单全拷，不删不碰）==="
          mkdir -p "$DEST/node_modules"
          for d in "$SRC"/*; do
            b=$(basename "$d")
            [ "$b" = "openclaw" ] && continue
            cp -r "$d" "$DEST/node_modules/"
          done

          echo "=== 剔除其他平台二进制（逐个判断，不用模糊通配符）==="
          # 原则：只删目录名里明确带其他平台标识的，且只看相对路径的后三级。
          # 不写 find | rm 大类模式 —— 上次就是那样把脚本引号搞坏导致整步失败。
          REMOVED=0
          for p in $(cd "$DEST/node_modules" && find . -maxdepth 3 -type d -print); do
            rel=${p#./}
            last=$(basename "$rel")
            if [ "$last" = "win32-x64" ] || [ "$last" = "win32-arm64" ] \
               || [ "$last" = "win32-ia32" ] || [ "$last" = "darwin-x64" ] \
               || [ "$last" = "darwin-arm64" ] || [ "$last" = "linux-x64" ] \
               || [ "$last" = "linux-ia32" ] || [ "$last" = "linux-ppc64" ] \
               || [ "$last" = "linux-s390x" ] || [ "$last" = "linux-riscv64" ] \
               || [ "$last" = "linux-musl-arm64" ] || [ "$last" = "linux-musl-x64" ]; then
              rm -rf "$DEST/node_modules/$rel"
              REMOVED=$((REMOVED+1))
            fi
          done
          echo "剔除 $REMOVED 个其他平台目录"

          echo "=== assets 体积 ==="
          du -sh "$DEST"
          echo "=== 顶层内容 ==="
          ls "$DEST" | head -12
          echo "=== 确认关键 JS ==="
          test -f "$DEST/dist/index.js" || { echo "✗ 缺 dist/index.js"; exit 1; }
          echo "✓ 网关运行时已就位"

      # ===== 内嵌 node 运行时（B 方案） =====
      # 为什么不用 git 存 libnode.so：44MB 超过 GitHub blobs API 单次上限（~40MB
      # base64 后），实测报 422 "input was too large"。
      # 改为从 Termux 官方源下载 aarch64 包，版本可控、仓库干净。
      # 选 nodejs-lts 24.22.x：与开发机当前运行的 v24.22.1 基本一致。
      - name: Fetch Termux node runtime
        run: |
          set -e
          mkdir -p /tmp/tx && cd /tmp/tx
          BASE=https://packages.termux.dev/apt/termux-main/pool/main
          # 精确版本（查过 Packages 索引）：
          URIS="
          $BASE/n/nodejs-lts/nodejs-lts_24.22.3_aarch64.deb
          $BASE/libi/libicu/libicu_79.1_aarch64.deb
          $BASE/o/openssl/openssl_1%3a3.6.5_aarch64.deb
          $BASE/c/c-ares/c-ares_1.34.9_aarch64.deb
          $BASE/libs/libsqlite/libsqlite_3.54.1-1_aarch64.deb
          $BASE/libc/libc++/libc++_30_aarch64.deb
          $BASE/z/zlib/zlib_1.4_aarch64.deb
          "
          for u in $URIS; do
            echo "↓ $u"
            curl -fL --retry 3 --retry-delay 3 -O "$u"
          done
          ls -lh *.deb
          echo "=== 解包 ==="
          mkdir -p ex
          for d in *.deb; do dpkg-deb -x "$d" ex; done
          echo "=== 找 node ==="
          find ex -name "node" -type f -exec ls -lh {} \;
          NODE=$(find ex -name "node" -type f | head -1)
          test -n "$NODE" || { echo "✗ 未找到 node 可执行"; exit 1; }
          echo "NODE=$NODE"
          "$NODE" -v 2>&1 | head -2 || echo "（直接跑不了，正常：需要在 Android 上跑）"

      - name: Install Termux node into jniLibs
        run: |
          set -e
          NODE=$(find /tmp/tx/ex -name "node" -type f | head -1)
          DEST=app/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          # node 改名 libnode.so：Android 只允许执行 lib/ 目录下以 lib*.so 命名的文件
          cp "$NODE" "$DEST/libnode.so"

          # 关键：Android packing 只收楼 lib<name>.so 形式，
          # libicuuc.so.79.1、libz.so.1.4 这种多级版本号会被静默丢弃（实测 2026-11-21）。
          # 所以全部改成 lib<name><版本拼接>.so：
          #   libicuuc.so.79.1 -> libicuuc79.so
          #   libz.so.1.4      -> libz1.so
          #   libcrypto.so.3   -> libcrypto3.so
          # 并在 Kotlin 侧建同名软链（GatewayLauncher.ensureSymlinks 已兼容）。
          echo "=== 拷入并重命名 Termux 库 ==="
          find /tmp/tx/ex -name "*.so*" -type f | while read -r f; do
            b=$(basename "$f")
            case "$b" in
              *.so)
                new="$b" ;;
              *.so.*)
                # libicuuc.so.79.1 -> 基名 libicuuc，主版本 79
                base=${b%%.so.*}
                rest=${b#*.so.}
                major=${rest%%.*}
                major=${major%%-*}
                new="${base}${major}.so" ;;
              *)
                continue ;;
            esac
            if [ ! -f "$DEST/$new" ]; then
              cp "$f" "$DEST/$new" && echo "  $b -> $new"
            fi
          done

          echo "=== jniLibs 最终清单 ==="
          ls -lh "$DEST" | awk 'NR>1{print $5, $9}'
          echo "=== 校验必需库 ==="
          test -f "$DEST/libnode.so" || { echo "✗ libnode.so 缺失"; exit 1; }
          for need in libicuuc* libicui18n* libicudata* libcrypto* libssl* libz[0-9]* libcares*; do
            ls "$DEST"/$need >/dev/null 2>&1 || { echo "✗ 缺 $need"; exit 1; }
          done
          echo "✓ 原生库齐全"

      - name: Build debug APK
        working-directory: app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log > /dev/null || true
          if grep -q "BUILD SUCCESSFUL" /tmp/build.log; then
            echo "✓ 构建成功"
            exit 0
          fi
          echo "=== 构建失败 ==="
          echo "--- 编译错误（e: 开头）---"
          grep -E "^e: " /tmp/build.log | head -40 || echo "（无）"
          echo "--- 出错任务 ---"
          grep -E "^> Task .*FAILED|^FAILURE:" /tmp/build.log || echo "（无）"
          echo "--- 根因（What went wrong 至 Caused by）---"
          awk '/What went wrong/,/BUILD FAILED/' /tmp/build.log | head -60 || true
          echo "--- Caused by 链 ---"
          grep -E "^Caused by:|^ *> " /tmp/build.log | head -30 || true
          echo "--- CMake / NDK 相关 ---"
          grep -iE "cmake|ndk|ninja|compiler" /tmp/build.log | grep -iv "at org\.\|at com\.\|at java" | head -30 || true
          echo "--- 尾部 40 行 ---"
          tail -40 /tmp/build.log
          exit 1

      - name: Verify APK contents
        working-directory: app
        run: |
          APK=$(find . -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "✗ 未找到 APK"; find . -path "*/outputs/*" | head -20; exit 1; fi
          echo "APK: $APK"; ls -lh "$APK"
          echo "=== gguf ==="; unzip -l "$APK" | grep -i "gguf" || echo "(无 gguf)"
          echo "=== so ==="; unzip -l "$APK" | grep "\.so" | head -20 || echo "(无 so)"
          if unzip -l "$APK" | grep -qi "gguf"; then echo "✓ 模型已打包"; else echo "✗ 缺模型"; exit 1; fi
          # 布局必须 strict：models/current/*.gguf（findAssetGguf 第一优先级）
          unzip -l "$APK" | grep -q "assets/models/current/.*\.gguf" || {
            echo "✗ 模型不在 assets/models/current/ —— App 会报「找不到模型文件」"; exit 1; }
          # 网关运行时：openclaw.mjs + dist 必须同时在
          unzip -l "$APK" | grep -q "assets/openclaw/runtime/openclaw.mjs" || { echo "✗ 缺 openclaw.mjs"; exit 1; }
          unzip -l "$APK" | grep -q "assets/openclaw/runtime/dist/index\.js" || { echo "✗ 缺 dist/index.js"; exit 1; }
          echo "✓ 网关运行时已打包"
          if unzip -l "$APK" | grep -q "\.so"; then echo "✓ native 库已打包"; else echo "✗ 缺 .so"; exit 1; fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endless-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
