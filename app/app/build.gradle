plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xundao.yongwuzhijing'
    compileSdk 34

    defaultConfig {
        applicationId "com.xundao.yongwuzhijing"
        minSdk 26
        targetSdk 34
        versionCode 45
        versionName "3.2.8"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        // 【最终写法 2026-11-22 04:40，三次修正后定稿】
        // AGP 对 ignoreAssetsPattern 的处理不是「覆盖默认」：它以 `.<defaults>` 起手
        // （DEFAULTS 里含 `.*` 和 `_*`），再按我们的 token 做集合增删。
        // 因此想让 `_vendor/` `_generated_/` `.github/` 进包，必须显式把它们减掉。
        // 注意不能写 `!.*` —— 那样连 .git 也一起保留；只写真正需要的三个前缀。
        // 实测（本机 aapt 规则模拟 + 3.1.8 包内反查）：
        //   旧写法 `'!.svn:...:!*~'` → 丢 840 条（_vendor 365 / _interactions 296 / 点目录 167）
        //   本写法 → 丢 0 条
        ignoreAssetsPattern '!_*:!.*:!.github:!*~:!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini'

        // 模型权重不能被压缩，否则 AAPT 会改坏且解压耗时翻倍
        noCompress 'weights'
        noCompress 'txt'
        noCompress 'jinja2'
        // gguf 必须不压缩：1GB 模型压缩时 JVM 直接 Java heap space
        // （2026-11-21 CI run 44786881843 就是这么挂的）
        noCompress 'gguf'
        // 注意：不能全局 noCompress 'json' —— assets/openclaw/node_modules 里有
        // 上万个小 json，不压缩会让 APK 多出几十 MB。模型目录的 json 体量很小，
        // 压缩也无所谓（AAPT 改坏的是 gguf 二进制，不是 json 文本）。
    }

    // 模型随 APK 下发：CI 把模型解到 assets/models/current，首次启动释放到私有目录
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation project(':llama')
}
