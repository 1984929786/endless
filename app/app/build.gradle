plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xundao.yongwuzhijing'
    compileSdk 34

    defaultConfig {
        applicationId "com.xundao.yongwuzhijing"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.2.5"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        // 模型权重不能被压缩，否则 AAPT 会改坏且解压耗时翻倍
        noCompress 'weights'
        noCompress 'txt'
        noCompress 'json'
        noCompress 'jinja2'
    }

    // 模型随 APK 下发：CI 把模型解到 assets/models/current，首次启动释放到私有目录
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
