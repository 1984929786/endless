plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xundao.yongwuzhijing'
    compileSdk 34

    defaultConfig {
        applicationId "com.xundao.yongwuzhijing"
        minSdk 26
        targetSdk 34
        // CI 用 run_number 自动递增，本地构建用时间戳兜底
        versionCode(Integer.parseInt(System.getenv("VERSION_CODE") ?: (System.currentTimeMillis() / 60000L).toString()))
        versionName(System.getenv("VERSION_NAME") ?: "3.9.0")

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    androidResources {
        // aapt2 对 _* 和 .* 开头的 assets 路径段按内建默认集丢弃
        // 真正对策在 CI 中处理（ununderscore.js + find -name '.*' -delete）
        ignoreAssetsPattern '!_*:!.*:!.github:!*~:!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini'
        noCompress 'txt'
        noCompress 'jinja2'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
