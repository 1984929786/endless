plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xundao.yongwuzhijing'
    compileSdk 34

    defaultConfig {
        applicationId "com.xundao.yongwuzhijing"
        minSdk 26
        targetSdk 34
        versionCode 39
        versionName "3.2.2"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        // 【2026-11-22 关键】AGP 默认的 ignoreAssetsPattern 里有 `<dir>_*` 和 `.*`，
        // 会把 assets 里以 _ 或 . 开头的文件/目录静默丢弃。
        // 现场后果：openclaw 运行时里 node_modules/openai/_vendor/ 76 个 js、
        // discord 的 _interactions/ 152 个 js、@anthropic-ai/sdk 等全部没进 APK，
        // 清单（52023 条）和包内（51350 条）差 673，App 永远校验不过。
        // 这些是别人的 npm 包，不能改名 —— 只能把忽略规则拿掉，让 aapt 老实全部打包。
        // 仍然保留真正无用的版本控制/系统垃圾文件过滤。
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'

        // 模型权重不能被压缩，否则 AAPT 会改坏且解压耗时翻倍
        noCompress 'weights'
        noCompress 'txt'
        noCompress 'jinja2'
        // gguf 必须不压缩：1GB 模型压缩时 JVM 直接 Java heap space
        // （2026-11-21 CI run 44786881843 就是这么挂的）
        noCompress 'gguf'
        // 注意：不能全局 noCompress 'json' —— assets/openclaw/node_modules 里有
        // 上万个小 json，不压缩会让 APK 多出几十 MB。模型目录的 json 体量很小，
        // 压缩也无所谓（AAPT 改坏的是 gguf 二进制，不是 json 文本）。
    }

    // 模型随 APK 下发：CI 把模型解到 assets/models/current，首次启动释放到私有目录
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation project(':llama')
}
