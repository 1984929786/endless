plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xundao.yongwuzhijing'
    compileSdk 34

    defaultConfig {
        applicationId "com.xundao.yongwuzhijing"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            // 模型权重不能被压缩，否则 AAPT 会改坏且解压耗时翻倍
            noCompress 'weights', 'txt', 'json', 'jinja2'
        }
    }

    // 模型不打包进 APK（1.4GB 会撑爆安装），改用外部目录
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
