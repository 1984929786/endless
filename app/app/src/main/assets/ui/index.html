<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>永无止境</title>
<style>
/* ===== CSS Reset & Variables ===== */
:root {
  --bg: #0a0c10;
  --bg2: #12151c;
  --bg3: #1a1e28;
  --bg4: #242836;
  --accent: #6c8cff;
  --accent2: #a78bfa;
  --accent-glow: rgba(108, 140, 255, 0.15);
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ===== Pages ===== */
.page {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
}
.page.active { display: flex; }

/* ===== Boot Page ===== */
#boot {
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
}
.boot-inner {
  text-align: center;
  padding: 40px;
  width: 100%;
  max-width: 320px;
}
.boot-inner .logo {
  margin-bottom: 24px;
  animation: pulse 2s ease-in-out infinite;
}
.boot-inner .logo svg { color: var(--accent); }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(0.97); }
}
#boot h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.boot-sub {
  color: var(--text3);
  font-size: 14px;
  margin-bottom: 48px;
}
.boot-status {
  color: var(--text2);
  font-size: 14px;
  margin-bottom: 16px;
  min-height: 20px;
}
.progress {
  width: 100%;
  height: 3px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 24px;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-bar.indeterminate {
  width: 30% !important;
  animation: slide 1.2s ease-in-out infinite;
}
@keyframes slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
.boot-inner .btn-primary, .boot-inner .btn-ghost {
  display: block;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: var(--font);
  cursor: pointer;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.boot-inner .btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-weight: 600;
}
.boot-inner .btn-ghost {
  background: transparent;
  color: var(--text3);
}
.hidden { display: none !important; }

/* ===== Top Bar ===== */
.topbar {
  display: flex;
  align-items: center;
  height: 56px;
  padding: 0 8px;
  background: var(--bg2);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  flex-shrink: 0;
  padding-top: env(safe-area-inset-top, 0px);
}
.icon-btn {
  width: 40px; height: 40px;
  border: none;
  background: transparent;
  color: var(--text);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.icon-btn:active { background: var(--bg4); }
.topbar-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 8px;
}

/* ===== Chat ===== */
.chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  padding-bottom: calc(80px + var(--safe-bottom));
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.chat::-webkit-scrollbar { width: 3px; }
.chat::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* Welcome */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 40px 20px;
}
.welcome .logo.small { margin-bottom: 20px; }
.welcome .logo.small svg { color: var(--accent); width: 64px; height: 64px; }
.welcome h2 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 10px;
}
.welcome .hint {
  color: var(--text3);
  font-size: 14px;
  line-height: 1.6;
}

/* Messages */
.msg {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  animation: fadeUp 0.25s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
}
.msg.user .avatar {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
}
.msg.ai .avatar {
  background: var(--bg3);
  color: var(--accent);
  border: 1px solid var(--bg4);
}
.bubble {
  max-width: 78%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.65;
  word-break: break-word;
  position: relative;
}
.msg.user .bubble {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.ai .bubble {
  background: var(--bg3);
  color: var(--text);
  border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.04);
}
.msg.msg-error .bubble {
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.2);
  color: var(--red);
}
.bubble.typing {
  color: var(--text3);
  font-style: italic;
}
.msg-time {
  font-size: 11px;
  color: var(--text3);
  margin-top: 4px;
  padding: 0 4px;
}
.msg.user .msg-time { text-align: right; }

/* ===== Composer ===== */
.composer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 12px;
  padding-bottom: calc(10px + var(--safe-bottom));
  background: var(--bg2);
  border-top: 1px solid rgba(255,255,255,0.04);
  z-index: 50;
}
.composer-inner {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg3);
  border-radius: 24px;
  padding: 6px 6px 6px 18px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: border-color 0.2s;
}
.composer-inner:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
#input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  line-height: 1.5;
  resize: none;
  max-height: 120px;
  outline: none;
  padding: 8px 0;
}
#input::placeholder { color: var(--text3); }
.send-btn {
  width: 40px; height: 40px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.2s, transform 0.15s;
}
.send-btn:disabled { opacity: 0.3; cursor: default; }
.send-btn:not(:disabled):active { transform: scale(0.9); }

/* ===== Drawer ===== */
.drawer-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 280px;
  background: var(--bg2);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  border-right: 1px solid rgba(255,255,255,0.04);
}
.drawer.show { transform: translateX(0); }
.drawer-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 24px 20px 20px;
}
.drawer-head .logo.tiny svg { color: var(--accent); }
.drawer-title {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.drawer-sub {
  font-size: 13px;
  color: var(--text3);
  margin-top: 2px;
}
.drawer-nav {
  flex: 1;
  padding: 8px 12px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 14px 16px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 16px;
  font-family: var(--font);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
  text-align: left;
}
.nav-item:active, .nav-item.active { background: var(--bg3); }
.nav-icon { font-size: 20px; width: 28px; text-align: center; }
.drawer-foot {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.model-badge {
  font-size: 12px;
  color: var(--text3);
  text-align: center;
  padding: 8px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
}

/* ===== Subpage ===== */
.subpage {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 150;
  display: none;
  flex-direction: column;
}
.subpage.show { display: flex; }
.sub-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.sub-content::-webkit-scrollbar { width: 3px; }
.sub-content::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* Cards */
.card {
  background: var(--bg2);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}
.card-desc {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}
.card-desc + .card-desc { margin-top: 4px; }
.empty {
  text-align: center;
  color: var(--text3);
  padding: 60px 20px;
  font-size: 15px;
  line-height: 1.8;
}

/* Buttons in subpages */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
}
.btn:not(.btn-primary) {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.06);
}
.btn:active { transform: scale(0.97); }

/* Session cards in history */
.session-card {
  padding: 14px 16px;
  background: var(--bg2);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.session-card:active { background: var(--bg3); }
.session-card-title {
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-card-meta {
  font-size: 12px;
  color: var(--text3);
}

/* API Key input */
.api-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 10px;
}
.api-input:focus { border-color: var(--accent); }
.api-input::placeholder { color: var(--text3); }

/* Status indicators */
.status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}
.status-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-dot.off { background: var(--red); }
.status-dot.warn { background: var(--yellow); }

/* Log pre */
.log-pre {
  font-size: 11px;
  color: var(--text3);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 200px;
  overflow-y: auto;
  background: var(--bg);
  padding: 10px;
  border-radius: var(--radius-sm);
  font-family: 'Courier New', monospace;
  line-height: 1.5;
}
</style>
</head>
<body>

<!-- ===== Boot ===== -->
<div id="boot" class="page active">
  <div class="boot-inner">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="96" height="96">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M50 4 a46 46 0 0 1 0 92 a23 23 0 0 1 0-46 a23 23 0 0 0 0-46" fill="currentColor"/>
        <circle cx="50" cy="27" r="6" fill="var(--bg)"/>
        <circle cx="50" cy="73" r="6" fill="currentColor"/>
      </svg>
    </div>
    <h1>永无止境</h1>
    <p class="boot-sub">OpenClaw · StepFun 云端大脑</p>
    <div id="bootStatus" class="boot-status">正在初始化…</div>
    <div class="progress"><div id="bootBar" class="progress-bar"></div></div>
    <button id="bootRetry" class="btn-primary hidden">重试</button>
    <button id="bootSkip" class="btn-ghost">跳过，直接进入</button>
  </div>
</div>

<!-- ===== Main ===== -->
<div id="main" class="page">

  <header class="topbar">
    <button id="btnMenu" class="icon-btn" aria-label="菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="topbar-title" id="topTitle">新对话</div>
    <button id="btnNew" class="icon-btn" aria-label="新对话">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </header>

  <main id="chat" class="chat">
    <div id="welcome" class="welcome">
      <div class="logo small">
        <svg viewBox="0 0 100 100" width="64" height="64">
          <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M50 4 a46 46 0 0 1 0 92 a23 23 0 0 1 0-46 a23 23 0 0 0 0-46" fill="currentColor"/>
          <circle cx="50" cy="27" r="6" fill="var(--bg)"/>
          <circle cx="50" cy="73" r="6" fill="currentColor"/>
        </svg>
      </div>
      <h2>有什么可以帮你？</h2>
      <p class="hint">由 OpenClaw 驱动<br>StepFun 云端大脑</p>
    </div>
    <div id="messages" class="messages"></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
      <button id="btnSend" class="send-btn" disabled aria-label="发送">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </footer>

  <!-- Drawer -->
  <div id="drawerMask" class="drawer-mask"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="logo tiny">
        <svg viewBox="0 0 100 100" width="34" height="34">
          <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M50 4 a46 46 0 0 1 0 92 a23 23 0 0 1 0-46 a23 23 0 0 0 0-46" fill="currentColor"/>
          <circle cx="50" cy="27" r="6" fill="var(--bg)"/>
          <circle cx="50" cy="73" r="6" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <div class="drawer-title">永无止境</div>
        <div class="drawer-sub">OpenClaw · StepFun</div>
      </div>
    </div>
    <nav class="drawer-nav">
      <button class="nav-item" data-page="chat"><span class="nav-icon">💬</span><span>对话</span></button>
      <button class="nav-item" data-page="history"><span class="nav-icon">🗂</span><span>历史会话</span></button>
      <button class="nav-item" data-page="gateway"><span class="nav-icon">🔗</span><span>网关状态</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span><span>设置</span></button>
      <button class="nav-item" data-page="about"><span class="nav-icon">ℹ️</span><span>关于</span></button>
    </nav>
    <div class="drawer-foot">
      <div id="modelBadge" class="model-badge">初始化中…</div>
    </div>
  </aside>

  <!-- Subpage -->
  <div id="subpage" class="subpage">
    <header class="topbar">
      <button id="btnBack" class="icon-btn" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="topbar-title" id="subTitle">页面</div>
      <div style="width:38px"></div>
    </header>
    <div id="subContent" class="sub-content"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
